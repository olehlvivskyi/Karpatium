name: Run Tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_call:

jobs:
  run-tests:

    runs-on: ubuntu-22.04
    env:
      WebManagerSettings__IsHeadlessEnabled: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore

      - name: Test
        id: test
        run: dotnet test --no-build --verbosity normal

      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: logs
          path: examples/ToolsQa.Tests/bin/Debug/net10.0/Logs/
          retention-days: 7

      - name: Upload allure-results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: examples/ToolsQa.Tests/bin/Debug/net10.0/allure-results/
          retention-days: 7
